[package]
name = "koyun"
version = "0.1.0"
description = "Panel de control del sistema para Windows (Tauri + React)"
authors = ["koyun"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "koyun_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-dialog = "2.8.3"
windows = { version = "0.62.2", features = [
    "Win32_System_StationsAndDesktops",
    "Win32_System_Power",
    "Win32_System_WindowsProgramming",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_System_Shutdown",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Networking_NetworkListManager",
    "Win32_NetworkManagement_WiFi",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Wmi",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_Graphics_Dwm",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Devices_FunctionDiscovery",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_System_Performance",
    "Win32_System_SystemInformation",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Diagnostics_Debug",
    "Win32_Networking_WinHttp",
    "Devices_Radios",
    "Devices_Bluetooth",
    "Devices_Enumeration",
    "Media_Control",
    "Storage_Streams",
    "Foundation",
    "Foundation_Collections",
    "UI_Notifications",
    "UI_Notifications_Management",
    "Data_Xml_Dom",
    "ApplicationModel",
    "ApplicationModel_DataTransfer",
    "Security_Cryptography",
] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp", "tiff", "webp"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
